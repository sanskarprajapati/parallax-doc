          <img id="cm-plate" src="assets/gen/cemetery.jpg" alt="Normandy American Cemetery" />
          <div id="cm-text"><span>T</span><span>h</span><span>a</span><span>t</span><span> </span><span>i</span><span>s</span><span> </span><span>n</span><span>o</span><span>t</span>

    <!-- foreground: huge dark stone cross swinging past the lens -->
    <div id="cm-cross" data-layout-ignore>

  <script>
    (function () {
      const FPS = 30;
      const T0 = 10.55; // host start, for converting reference frames to local time
      const at = (frame) => frame / FPS - T0;
      const tl = gsap.timeline({ paused: true });

      // ---- T2: the cross swings down from the top right and its post sweeps right to left ----
      // reference post centre: f330 ~2350 (only the arm corner in frame), f342 ~1200, f350 ~800,
      // f356 ~240, f366 off left. The cemetery exists only right of the post centre.
      const W0 = 0.35, W1 = 1.62; // local seconds (f327 -> f365)
      const cross = { x: 2500, y: -420, r: -9 };
      const reveal = document.getElementById("cm-reveal");
      const crossEl = document.getElementById("cm-cross");
      const rightOf = (L) => `polygon(${L}px -100px, 2100px -100px, 2100px 1200px, ${L}px 1200px)`;
      const rig = {};
      ["x", "y", "r"].forEach((k) => {
        rig[k] = function (v) {
          if (v === undefined) return cross[k];
          cross[k] = v;
          gsap.set(crossEl, { x: cross.x, y: cross.y, rotation: cross.r });
          reveal.style.clipPath = rightOf(cross.x);
        };
      });
      rig.x(cross.x);
      tl.fromTo(rig, { x: 2450 }, { x: -520, duration: W1 - W0, ease: "none" }, W0);
      tl.fromTo(rig, { y: -300 }, { y: 330, duration: 0.7, ease: "power2.out" }, W0);
      tl.fromTo(rig, { r: 6 }, { r: 0, duration: W1 - W0, ease: "sine.out" }, W0);

      // ---- S4 camera: dolly forward and truck right from Anderson to Williams ----
      const frame = (s, cx, cy) => ({ scale: s, x: 960 - cx * s, y: 540 - cy * s });
      tl.fromTo("#cm-cam", frame(1.1, 873, 650), { ...frame(1.55, 1882, 421), duration: 4.6, ease: "sine.inOut" }, 0.3);
      tl.to("#cm-cam", { ...frame(1.62, 1882, 421), duration: 4.5, ease: "none" }, 4.9);

      // ---- "That is not / in question", typed in with the narration (f392-f429) ----
      const typeFrames = [371, 373, 375, 376, 378, 379, 382, 383, 384, 386, 387, 392, 393, 394, 397, 398, 400, 402, 403, 405, 407, 408];
      document.querySelectorAll("#cm-text span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at(typeFrames[i]));
      });

      // ---- the newspaper arrives in front: the cemetery falls out of focus (f460-f496) ----
      tl.fromTo("#cm-blur", { filter: "blur(0px) brightness(1)" }, { filter: "blur(9px) brightness(0.8)", duration: 0.8, ease: "sine.out" }, at(462));

      window.__timelines["cemetery"] = tl;
    })();
  </script>
