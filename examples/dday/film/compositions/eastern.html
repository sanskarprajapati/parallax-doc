<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #cfcfcf;
    }
    #ea-blur {
      position: absolute;
      inset: 0;
    }
    #ea-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
    }
    #ea-cam img {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
      object-fit: cover;
    }
    #ea-text {
      position: absolute;
      left: 150px;
      top: 70px;
      font-family: var(--font-script, "Cormorant Upright"), serif;
      font-weight: 600;
      font-size: 96px;
      line-height: 92px;
      white-space: pre;
      color: var(--color-ink, #f4f1ea);
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.35),
        0 3px 20px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(0, 0, 0, 0.5);
    }
    #ea-text span {
      opacity: 0;
    }
    #ea-text .red {
      color: var(--color-accent, #ff1f35);
      text-shadow:
        0 0 12px rgba(255, 20, 40, 0.95),
        0 0 34px rgba(255, 0, 30, 0.7),
        0 3px 20px rgba(0, 0, 0, 0.6);
    }
    #ea-post {
      position: absolute;
      left: 0;
      top: -260px;
      width: 900px;
      height: 1600px;
    }
    #ea-post img {
      width: 100%;
      height: 100%;
      display: block;
      filter: blur(10px) brightness(0.45);
    }
  </style>
  <div id="root" data-composition-id="eastern" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="ea-blur" data-layout-ignore>
      <div id="ea-cam">
        <img src="assets/gen/eastern_front.jpg" alt="German soldiers retreating across the frozen Eastern Front" />
        <div id="ea-text" data-text="died fighting&#10;the |Soviet Union">died fighting the Soviet Union</div>
      </div>
      <!-- foreground: a barbed-wire post drifts past the lens -->
      <div id="ea-post"><img src="assets/cut/wire_post.png" alt="" /></div>
    </div>
  </div>
  <script>
    (function () {
      const FPS = 30;
      const tl = gsap.timeline({ paused: true });

      function typeOn(el, start, frameStep) {
        const [plain, red] = el.dataset.text.split("|");
        el.innerHTML = "";
        [...plain].concat([...red].map((c) => ({ c }))).forEach((ch, i) => {
          const s = document.createElement("span");
          s.textContent = typeof ch === "string" ? ch : ch.c;
          if (typeof ch !== "string") s.className = "red";
          el.appendChild(s);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, start + (i * frameStep) / FPS);
        });
      }

      // starts exactly where the map's zoom landed (picture filling the frame), keeps travelling:
      // a slow push and a drift right, along the column of soldiers
      const frame = (s, cx, cy) => ({ scale: s, x: 960 - cx * s, y: 540 - cy * s });
      tl.fromTo("#ea-cam", frame(1, 960, 540), { ...frame(1.2, 1180, 520), duration: 4.9, ease: "sine.out" }, 0);

      // the post passes right to left in front of everything (parallax: much faster than the plate)
      tl.fromTo("#ea-post", { x: 2100 }, { x: -1100, duration: 2.6, ease: "sine.inOut" }, 0.15);

      // "died fighting the Soviet Union" (VO 30.84-32.6 -> local 2.44-4.2)
      typeOn(document.getElementById("ea-text"), 2.3, 2);

      // the telegram arrives in front: this world falls out of focus
      tl.fromTo("#ea-blur", { filter: "blur(0px) brightness(1)" }, { filter: "blur(10px) brightness(0.75)", duration: 0.8, ease: "sine.out" }, 4.45);

      window.__timelines["eastern"] = tl;
    })();
  </script>
</template>
