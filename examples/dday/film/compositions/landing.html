  </style>
  <div
    id="root"
    data-composition-id="landing"
    data-width="1920"
    data-height="1080"
    data-layout-allow-overflow
    data-layout-allow-overlap
  >
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="ld-mbh" x="-5%" y="0%" width="110%" height="100%"><feGaussianBlur id="ld-mbh-g" stdDeviation="0 0" /></filter>
      <filter id="ld-mbv" x="0%" y="-5%" width="100%" height="110%"><feGaussianBlur id="ld-mbv-g" stdDeviation="0 0" /></filter>
    </svg>
    <!-- back: the sea and the lone landing craft (S2 background, S3 hero) -->
    <div id="ld-bg" class="layer" data-layout-ignore>
      <img id="ld-bg-img" src="assets/gen/boat_far.jpg" alt="Landing craft at sea" />
    </div>

    <!-- S1: waving flag, archival GIs, title. Pulled back, then trucked off left -->
    <div id="ld-s1" class="layer">
      <div id="ld-s1cam">
        <canvas id="ld-flag" width="2350" height="1450"></canvas>
        <img id="ld-flagsrc" src="assets/gen/flag.jpg" alt="" />
        <img id="ld-archival" src="assets/cut/archival.png" alt="GIs in a landing craft" />
        <div id="ld-title">D-Day</div>
        <div id="ld-date"><span>J</span><span>u</span><span>n</span><span>e</span><span> </span><span>6</span><span>t</span><span>h</span><span>,</span><span> </span><span>1</span><span>9</span><span>4</span><span>4</span><span>.</span></div>
      </div>
    </div>

    <div id="ld-runner" class="layer" data-layout-ignore>
      <img src="assets/cut/runner.png" alt="GI running out of the surf" />
    </div>
    <div id="ld-boat" class="layer" data-layout-ignore>
      <img src="assets/cut/boat_near.png" alt="GIs crouched in a landing craft" />
    </div>
    <!-- foreground parallax: smoke column hides the seam, shingle runs along the bottom -->
    <div id="ld-smoke" class="layer" data-layout-ignore>
      <div id="ld-smoke-in">
        <img id="ld-smoke-a" src="assets/cut/spray.png" alt="" />
        <img id="ld-smoke-b" src="assets/cut/spray.png" alt="" />
      </div>
    </div>
    <div id="ld-shingle" class="layer" data-layout-ignore>
      <div id="ld-shingle-in"><img src="assets/cut/shingle.png" alt="" /></div>
    </div>
  </div>
  <script>
    (function () {
      const FPS = 30;
      const tl = gsap.timeline({ paused: true });

      // ---- flag: vertical strips displaced by two travelling sine waves, shaded by slope ----
      const canvas = document.getElementById("ld-flag");
      const ctx = canvas.getContext("2d");
      const src = document.getElementById("ld-flagsrc");
      const STRIP = 6;
      const wave = { t: 0 };
      function drawFlag() {
        if (!src.complete || !src.naturalWidth) return;
        const W = canvas.width;
        const H = canvas.height;
        const sw = src.naturalWidth;
        const sh = src.naturalHeight;
        ctx.clearRect(0, 0, W, H);
        for (let x = 0; x < W; x += STRIP) {
          const p1 = x * 0.0042 - wave.t * 2.3;
          const p2 = x * 0.0091 - wave.t * 3.7 + 1.3;
          const dy = 34 * Math.sin(p1) + 12 * Math.sin(p2);
          const slope = Math.cos(p1) * 0.75 + Math.cos(p2) * 0.35;
          const sx = (x / W) * sw;
          ctx.drawImage(src, sx, 0, (STRIP / W) * sw + 1, sh, x, dy - 40, STRIP + 1, H + 80);
          ctx.fillStyle = slope > 0 ? `rgba(255,255,255,${0.1 * slope})` : `rgba(0,0,0,${-0.42 * slope})`;
          ctx.fillRect(x, 0, STRIP + 1, H);
        }
      }
      tl.fromTo(wave, { t: 0 }, { t: 12.3, duration: 12.3, ease: "none", onUpdate: drawFlag }, 0);
      if (src.complete) drawFlag();
      else src.addEventListener("load", drawFlag);

      // ---- S1 camera: pull back from the title (reference f0-f61), then a slow drift ----
      tl.fromTo("#ld-s1cam", { scale: 2.1, y: 190 }, { scale: 1, y: 0, duration: 2.1, ease: "sine.out" }, 0);
      tl.to("#ld-s1cam", { scale: 0.93, y: -12, duration: 1.9, ease: "sine.inOut" }, 2.1);

      // archival GIs rise into frame from the bottom edge (reference f39-f64)
      tl.fromTo("#ld-archival", { y: 460 }, { y: 0, duration: 1.0, ease: "power2.out" }, 1.15);

      // date typewriter, frame-exact to the reference
      const dateFrames = [0, 3, 6, 10, 14, 18, 21, 24, 29, 32, 35, 39, 43, 46, 50];
      document.querySelectorAll("#ld-date span").forEach((el, i) => {
        tl.set(el, { opacity: 1 }, dateFrames[i] / FPS);
      });

      // ---- T1: camera truck right past the spray column (reference f118-f185) ----
      // One camera value drives every layer at its own parallax. The column is a hard seam:
      // the flag world exists only left of its centre, the sea world only right of it.
      const $ = (id) => document.getElementById(id);
      const s1 = $("ld-s1"), bg = $("ld-bg"), runner = $("ld-runner"), boat = $("ld-boat");
      const smoke = $("ld-smoke"), shingle = $("ld-shingle");
      const mbh = $("ld-mbh-g"), mbv = $("ld-mbv-g");
      const COL0 = 2060, COLF = 1.35, COLW = 373; // column centre on screen at cam 0, parallax, half width
      // feathered seam, hidden inside the column's dense core
      const FEATHER = 110;
      const leftOf = (L) => `linear-gradient(to right, #000 ${L - FEATHER}px, transparent ${L + FEATHER}px)`;
      const rightOf = (L) => `linear-gradient(to right, transparent ${L - FEATHER}px, #000 ${L + FEATHER}px)`;
      const mask = (el, m) => {
        el.style.maskImage = m;
        el.style.webkitMaskImage = m;
      };
      const st = { c: 0, blur: 0, boatX: 1920, drop: 0 };
      function apply() {
        const c = st.c;
        const col = COL0 - COLF * c;
        const x = { s1: -c, bg: 16 - 0.2 * c, runner: 1745 - 1.2 * c, smoke: col - COLW, shingle: 1788 - 2.2 * c };
        gsap.set(s1, { x: x.s1 });
        gsap.set(bg, { x: x.bg });
        gsap.set(runner, { x: x.runner });
        gsap.set(smoke, { x: x.smoke });
        gsap.set(shingle, { x: x.shingle });
        gsap.set(boat, { x: st.boatX });
        const seam = col > -200;
        mask(s1, seam ? leftOf(col - x.s1) : "none");
        s1.style.visibility = col < -200 ? "hidden" : "visible";
        mask(runner, seam ? rightOf(col - x.runner) : "none");
        mask(boat, seam ? rightOf(col - st.boatX) : "none");
        mbh.setAttribute("stdDeviation", `${st.blur} 0`);
        mbv.setAttribute("stdDeviation", `0 ${st.drop}`);
        const f = st.blur > 0.2 ? "url(#ld-mbh)" : "none";
        [s1, runner, smoke, shingle, bg].forEach((el) => (el.style.filter = f));
        boat.style.filter = st.drop > 0.2 ? "url(#ld-mbv)" : f;
      }
      // GSAP calls a function property as a setter on every render, including seeks
      const rig = {};
      Object.keys(st).forEach((k) => {
        rig[k] = function (v) {
          if (v === undefined) return st[k];
          st[k] = v;
          apply();
        };
      });
      apply();

      tl.fromTo(rig, { c: 0 }, { c: 2000, duration: 2.24, ease: "sine.inOut" }, 4.0);
      tl.fromTo(rig, { blur: 0 }, { blur: 5, duration: 1.12, ease: "sine.inOut" }, 4.0);
      tl.to(rig, { blur: 0, duration: 1.2, ease: "sine.inOut" }, 5.12);

      // the colour landing craft sweeps in from the right just behind the column (f156-f205)
      tl.fromTo(rig, { boatX: 1920 }, { boatX: -40, duration: 1.7, ease: "power2.out" }, 5.17);
      tl.fromTo("#ld-boat img", { scale: 1 }, { scale: 1.08, duration: 1.3, ease: "sine.inOut", transformOrigin: "40% 40%" }, 5.9);

      // ---- boom up: the camera rises and dollies over the near boat (f218-f262) ----
      // the near GIs grow and fall out of the bottom, the far craft grows and centres
      tl.fromTo("#ld-runner img", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, 7.0);
      // drop and push-in are one move over the same window (reference f216-f259):
      // the near GIs sink slowly then fall away while the far craft grows the whole time
      const BOOM = { start: 7.2, dur: 1.45 };
      // ease the far craft back a little while we pass the near GIs, so the push-in has room to grow
      tl.fromTo("#ld-bg-img", { scale: 1, y: 0 }, { scale: 0.84, y: 0, duration: 1.6, ease: "sine.inOut", transformOrigin: "46% 62%" }, 5.6);
      tl.to("#ld-bg-img", { scale: 1.36, y: -50, duration: BOOM.dur, ease: "sine.inOut", transformOrigin: "46% 62%" }, BOOM.start);
      tl.to("#ld-boat img", { scale: 1.6, duration: BOOM.dur, ease: "power2.in", transformOrigin: "50% 20%" }, BOOM.start);
      tl.to("#ld-boat", { y: 1700, duration: BOOM.dur, ease: "power2.in" }, BOOM.start);
      tl.fromTo(rig, { drop: 0 }, { drop: 10, duration: BOOM.dur, ease: "power2.in" }, BOOM.start);
      tl.set(rig, { drop: 0 }, BOOM.start + BOOM.dur);
      // then the slow drift on the lone craft until the cross arrives
      tl.to("#ld-bg-img", { scale: 1.46, y: -60, duration: 12.3 - BOOM.start - BOOM.dur, ease: "none" }, BOOM.start + BOOM.dur);

      window.__timelines["landing"] = tl;
    })();
  </script>
