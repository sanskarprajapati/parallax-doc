<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #nw-blur {
      position: absolute;
      inset: 0;
    }
    #nw-sway {
      position: absolute;
      inset: 0;
      transform-origin: 960px 700px;
    }
    #nw-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 2736px;
      height: 1536px;
      transform-origin: 0 0;
    }
    #nw-cam > img {
      position: absolute;
      left: 0;
      top: 0;
      width: 2736px;
      height: 1536px;
      display: block;
    }
    #nw-photo {
      position: absolute;
      left: 1722px;
      top: 558px;
      width: 500px;
      height: 302px;
      overflow: hidden;
    }
    #nw-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #nw-thumb {
      clip-path: polygon(2163px 864px, 2166px 820px, 2180px 794px, 2205px 782px, 2236px 786px, 2242px 864px);
    }
  </style>
  <div
    id="root"
    data-composition-id="news"
    data-width="1920"
    data-height="1080"
    data-layout-allow-overflow
    data-layout-allow-overlap
  >
    <div id="nw-blur" data-layout-ignore>
      <div id="nw-sway">
        <div id="nw-cam">
          <img id="nw-paper" src="assets/cut/newspaper.png" alt="The Stars and Stripes, June 1944, held in two hands" />
          <!-- the front-page photo is the war room: the zoom-through lands inside it -->
          <div id="nw-photo">
            <img id="nw-photo-color" src="assets/gen/warroom.jpg" alt="Eisenhower speaks to allies" />
          </div>
          <img id="nw-thumb" src="assets/cut/newspaper.png" alt="" />
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // One camera: plate point (cx, cy) at the frame centre, scale held as ln(scale) so zooms read evenly.
      const cam = { ls: Math.log(2.1), cx: 2772, cy: 520, sway: 0 };
      const camEl = document.getElementById("nw-cam");
      const swayEl = document.getElementById("nw-sway");
      function apply() {
        const s = Math.exp(cam.ls);
        gsap.set(camEl, { scale: s, x: 960 - cam.cx * s, y: 540 - cam.cy * s });
        gsap.set(swayEl, { rotation: 0.9 * Math.sin(cam.sway * Math.PI), y: -7 * Math.sin(cam.sway * Math.PI) });
      }
      const rig = {};
      Object.keys(cam).forEach((k) => {
        rig[k] = function (v) {
          if (v === undefined) return cam[k];
          cam[k] = v;
          apply();
        };
      });
      apply();
      const L = Math.log;

      // ---- T3: the paper's right edge leads in from the left, very close (f458-f471),
      // then one continuous pull-back settles with the hands at the frame edges (f471-f500) ----
      tl.to(rig, { cx: 2190, cy: 540, ls: L(2.0), duration: 0.45, ease: "none" }, 0.03);
      tl.to(rig, { cx: 1420, cy: 800, ls: L(0.8), duration: 1.25, ease: "power2.out" }, 0.45);
      tl.fromTo("#nw-blur", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 1.0, ease: "sine.out" }, 0.0);

      // ---- S5: handheld hold with a slow push (f500-f559) ----
      tl.to(rig, { ls: L(0.85), cx: 1440, cy: 790, duration: 1.68, ease: "sine.inOut" }, 1.7);
      tl.to(rig, { sway: 1, duration: 1.9, ease: "none" }, 1.45);

      // ---- T4: zoom through the Eisenhower photo, decelerating into it (f559-f596) ----
      tl.to(rig, { ls: L(3.84), cx: 1972, cy: 709, duration: 1.25, ease: "sine.out" }, 3.38);
      tl.fromTo("#nw-thumb", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "none" }, 3.55);
      tl.fromTo("#nw-photo-color", { filter: "saturate(0.45) sepia(0.35)" }, { filter: "saturate(1) sepia(0)", duration: 1.0, ease: "sine.inOut" }, 3.5);

      window.__timelines["news"] = tl;
    })();
  </script>
</template>
