  <script>
    (function () {
      const FPS = 30;
      const T0 = 19.85;
      const at = (frame) => frame / FPS - T0;
      const tl = gsap.timeline({ paused: true });

      // starts exactly where the newspaper zoom landed (photo box filling the frame), keeps pushing
      tl.fromTo("#wr-cam", { scale: 1.074 }, { scale: 1.12, duration: 1.7, ease: "sine.inOut" }, 0);
      // then the camera dives into the map on the table; the map scene takes over under the blur
      tl.to("#wr-cam", { scale: 2.6, x: 156, y: -728, duration: 1.45, ease: "power2.in" }, 1.7);
      tl.fromTo("#wr-cam", { filter: "blur(0px)" }, { filter: "blur(16px)", duration: 0.7, ease: "power1.in" }, 2.45);

      // "strategic reality" typed onto the table (f608-f639)
      const typeFrames = [608, 610, 612, 613, 615, 617, 619, 622, 624, 627, 628, 630, 632, 634, 636, 637, 639];
      document.querySelectorAll("#wr-text span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at(typeFrames[i]));
      });

      // red line draws itself from the words down to the Normandy coast (f630-f645)
      const path = document.getElementById("wr-path");
      const len = path.getTotalLength() || 900;
      tl.fromTo(
        path,
        { strokeDasharray: len, strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        at(630),
      );

      window.__timelines["warroom"] = tl;
    })();
