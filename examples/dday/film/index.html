<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Text","default":"#f4f1ea"},
    {"id":"color-accent","type":"color","label":"Accent red","default":"#ff1f35"},
    {"id":"font-title","type":"string","label":"Title font","default":"Inter"},
    {"id":"font-script","type":"string","label":"Emphasis font","default":"Cormorant Upright"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Cormorant Upright (SIL Open Font License, assets/fonts/OFL.txt) */
      @font-face {
        font-family: "Cormorant Upright";
        src: url("assets/fonts/CormorantUpright-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Cormorant Upright";
        src: url("assets/fonts/CormorantUpright-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Cormorant Upright";
        src: url("assets/fonts/CormorantUpright-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      :root {
        --color-ink: #f4f1ea;
        --color-accent: #ff1f35;
        --font-title: "Inter";
        --font-script: "Cormorant Upright";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      D-Day opener, 1:1 style test of reference video/PgLKq_bp33hPtsWR.mp4.
      One continuous camera move: no hard cuts. Scenes overlap where one world passes
      behind a foreground object (smoke, stone cross, newspaper, zoom into a photo).
      Film look (grade, channel split, grain, dust, dots, vignette) is a second pass: ../finish (render.sh).
    -->
    <div
      id="root"

      data-duration="60"
      data-width="1920"
      data-height="1080"
