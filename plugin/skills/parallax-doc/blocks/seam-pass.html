<!--
  BLOCK seam-pass: the camera trucks right past a tall column (spray, smoke, a pillar of
  debris) close to the lens. The previous scene exists only left of the column's centre,
  this scene's world only right of it, so the world changes inside one camera move.
  Every layer moves at its own parallax factor of the one camera value; motion blur
  peaks mid-move. A subject can sweep in behind the column, and the scene can end with
  a boom-up: the near layer sinks out of frame while the far plate pushes in.
  Reference: D-Day f116-f262. Start this scene's host at the previous scene's
  exit.at, and give that exit the same distance and duration as CONFIG.camera.
  Plates: far (opaque), subject (cutout), near (cutout), column (cutout), strip (cutout).
-->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #root .{{id}}-layer {
      position: absolute;
      left: 0;
      top: 0;
    }
    #root .{{id}}-layer img {
      display: block;
      width: 100%;
      height: 100%;
    }
    #{{id}}-far { width: 2688px; height: 1510px; top: -215px; }
    #{{id}}-subject { width: 870px; height: 1160px; top: -20px; }
    #{{id}}-near { width: 2600px; height: 1459px; top: 0; }
    #{{id}}-column { width: 747px; height: 1330px; top: -170px; }
    #{{id}}-column-in { position: absolute; inset: 0; filter: saturate(0.25) brightness(0.92) contrast(1.1); }
    #{{id}}-column-in img { position: absolute; top: 0; left: 0; width: 747px; height: 1330px; }
    #{{id}}-column-b { transform: scaleX(-1); }
    #{{id}}-strip { width: 2600px; height: 1114px; top: 423px; }
    #{{id}}-strip-in { position: absolute; inset: 0; filter: blur(4px) brightness(0.9) saturate(0.5); }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="{{id}}-mbh" x="-5%" y="0%" width="110%" height="100%"><feGaussianBlur id="{{id}}-mbh-g" stdDeviation="0 0" /></filter>
      <filter id="{{id}}-mbv" x="0%" y="-5%" width="100%" height="110%"><feGaussianBlur id="{{id}}-mbv-g" stdDeviation="0 0" /></filter>
    </svg>
    <div id="{{id}}-far" class="{{id}}-layer" data-layout-ignore><img id="{{id}}-far-img" src="assets/gen/far.jpg" alt="The world beyond the column" /></div>
    <div id="{{id}}-subject" class="{{id}}-layer" data-layout-ignore><img id="{{id}}-subject-img" src="assets/cut/subject.png" alt="A figure caught mid-move" /></div>
    <div id="{{id}}-near" class="{{id}}-layer" data-layout-ignore><img id="{{id}}-near-img" src="assets/cut/near.png" alt="The near layer that sweeps in" /></div>
    <div id="{{id}}-column" class="{{id}}-layer" data-layout-ignore>
      <div id="{{id}}-column-in">
        <img id="{{id}}-column-a" src="assets/cut/column.png" alt="" />
        <img id="{{id}}-column-b" src="assets/cut/column.png" alt="" />
      </div>
    </div>
    <div id="{{id}}-strip" class="{{id}}-layer" data-layout-ignore>
      <div id="{{id}}-strip-in"><img src="assets/cut/strip.png" alt="" /></div>
    </div>
  </div>
  <script src="assets/lib/parallax.js"></script>
  <script>
    (function () {
      const CONFIG = {
        // the camera: c goes 0 -> distance; every layer's x = base - factor * c
        camera: { at: 0, distance: 2000, dur: 2.24, blurPeak: 5 },
        column: { x0: 2060, factor: 1.35, halfWidth: 373, feather: 110 },
        far: { base: 16, factor: 0.2 },
        subject: { base: 1745, factor: 1.2, hideAt: 3.0 }, // hideAt: when it leaves for good (null to keep)
        strip: { base: 1788, factor: 2.2 },
        // the near layer sweeps in from the right just behind the column
        near: { fromX: 1920, toX: -40, at: 1.17, dur: 1.7, push: 1.08 },
        // boom-up: near layer sinks and grows out of frame while the far plate pushes in.
        // One window, one start: the two moves must read as one. null for no boom.
        boom: { at: 3.2, dur: 1.45, farFrom: 0.84, farTo: 1.36, nearScale: 1.6, nearDrop: 1700, holdTo: 1.46, sceneEnd: 8.3 },
      };
      const tl = gsap.timeline({ paused: true });
      const id = "{{id}}";
      const $ = (s) => document.getElementById(id + "-" + s);
      const far = $("far"), subject = $("subject"), near = $("near"), column = $("column"), strip = $("strip");
      const C = CONFIG;

      const st = { c: 0, blur: 0, nearX: C.near.fromX, drop: 0 };
      function apply() {
        const col = C.column.x0 - C.column.factor * st.c;
        const subjX = C.subject.base - C.subject.factor * st.c;
        gsap.set(far, { x: C.far.base - C.far.factor * st.c });
        gsap.set(subject, { x: subjX });
        gsap.set(column, { x: col - C.column.halfWidth });
        gsap.set(strip, { x: C.strip.base - C.strip.factor * st.c });
        gsap.set(near, { x: st.nearX });
        const seam = col > -200;
        // this scene's world only right of the column centre (the previous scene shows left of it)
        [far, subject, near, strip].forEach((el) => seamMask(el, seam ? col - gsap.getProperty(el, "x") : -9999, "right", C.column.feather));
        [far, subject, column, strip].forEach((el) => motionBlur(el, id + "-mbh", st.blur, 0));
        motionBlur(near, st.drop > 0.3 ? id + "-mbv" : id + "-mbh", st.drop > 0.3 ? 0 : st.blur, st.drop);
      }
      const rig = {};
      Object.keys(st).forEach((k) => {
        rig[k] = function (v) {
          if (v === undefined) return st[k];
          st[k] = v;
          apply();
        };
      });
      apply();

      const K = C.camera;
      tl.fromTo(rig, { c: 0 }, { c: K.distance, duration: K.dur, ease: "sine.inOut" }, K.at);
      tl.fromTo(rig, { blur: 0 }, { blur: K.blurPeak, duration: K.dur / 2, ease: "sine.inOut" }, K.at);
      tl.to(rig, { blur: 0, duration: K.dur / 2, ease: "sine.inOut" }, K.at + K.dur / 2);

      tl.fromTo(rig, { nearX: C.near.fromX }, { nearX: C.near.toX, duration: C.near.dur, ease: "power2.out" }, C.near.at);
      tl.fromTo($("near-img"), { scale: 1 }, { scale: C.near.push, duration: 1.3, ease: "sine.inOut", transformOrigin: "40% 40%" }, C.near.at + 0.73);
      if (C.subject.hideAt != null) tl.fromTo($("subject-img"), { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, C.subject.hideAt);

      if (C.boom) {
        const B = C.boom;
        tl.fromTo($("far-img"), { scale: 1 }, { scale: B.farFrom, duration: 1.6, ease: "sine.inOut", transformOrigin: "46% 62%" }, Math.max(0, B.at - 1.6));
        tl.to($("far-img"), { scale: B.farTo, y: -50, duration: B.dur, ease: "sine.inOut", transformOrigin: "46% 62%" }, B.at);
        tl.to($("near-img"), { scale: B.nearScale, duration: B.dur, ease: "power2.in", transformOrigin: "50% 20%" }, B.at);
        tl.to(near, { y: B.nearDrop, duration: B.dur, ease: "power2.in" }, B.at);
        tl.fromTo(rig, { drop: 0 }, { drop: 10, duration: B.dur, ease: "power2.in" }, B.at);
        tl.set(rig, { drop: 0 }, B.at + B.dur);
        tl.to($("far-img"), { scale: B.holdTo, y: -60, duration: Math.max(0.1, B.sceneEnd - B.at - B.dur), ease: "none" }, B.at + B.dur);
      }

      window.__timelines[id] = tl;
    })();
  </script>
</template>
