<!--
  BLOCK title-open: the cold open. A waving texture (flag, banner, map) fills the frame,
  a cut-out archival layer rises from the bottom edge, a heavy title sits on top and a
  date types on beneath it, while the camera pulls back off the title.
  Reference: D-Day f0-f118. Plates: background (opaque, waves), riser (cutout).
-->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #6f777c;
    }
    #{{id}}-stage,
    #{{id}}-cam {
      position: absolute;
      inset: 0;
    }
    #{{id}}-wave {
      position: absolute;
      left: -150px;
      top: -200px;
      width: 2350px;
      height: 1450px;
    }
    #{{id}}-wavesrc {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    #{{id}}-riser {
      position: absolute;
      left: -100px;
      top: 290px;
      width: 2320px;
      height: 1302px;
    }
    #{{id}}-title {
      left: 0;
      top: 196px;
      width: 1860px;
      text-align: center;
      font-size: 112px;
    }
    #{{id}}-date {
      left: 792px;
      top: 330px;
      font-weight: 500;
      letter-spacing: 0;
    }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="{{id}}-stage">
    <div id="{{id}}-cam">
      <canvas id="{{id}}-wave" width="2350" height="1450"></canvas>
      <img id="{{id}}-wavesrc" src="assets/gen/flag.jpg" alt="" />
      <img id="{{id}}-riser" src="assets/cut/archival.png" alt="Archival cut-out rising into frame" />
      <div id="{{id}}-title" class="pd-title">D-Day</div>
      <div id="{{id}}-date" class="pd-label" data-text="June 6th, 1944.">June 6th, 1944.</div>
    </div>
    </div>
  </div>
  <script src="assets/lib/parallax.js"></script>
  <script>
    (function () {
      const CONFIG = {
        wave: true, // false: the background just drifts (use for maps, skies)
        pullBack: { fromScale: 2.1, fromY: 190, dur: 2.1, origin: "930px 270px" },
        drift: { scale: 0.93, y: -12, dur: 1.9 },
        riser: { from: 460, at: 1.15, dur: 1.0 }, // px below its rest, start, length
        date: { at: 0, step: 3.3 }, // typed under the title, frames per letter
        // hand-off to a seam-pass scene: the whole opener trucks left with the same
        // start, distance and length as that scene's camera (null to stay put)
        exit: { at: 4.0, distance: 2000, dur: 2.24 },
      };
      const tl = gsap.timeline({ paused: true });
      const id = "{{id}}";
      const $ = (s) => document.getElementById(id + "-" + s);

      // waving fabric: vertical strips displaced by two travelling sines, shaded by slope
      const canvas = $("wave");
      const ctx = canvas.getContext("2d");
      const src = $("wavesrc");
      const draw = (t) => {
        if (!src.complete || !src.naturalWidth) return;
        const W = canvas.width, H = canvas.height, sw = src.naturalWidth, sh = src.naturalHeight, STRIP = 6;
        ctx.clearRect(0, 0, W, H);
        for (let x = 0; x < W; x += STRIP) {
          const p1 = x * 0.0042 - t * 2.3, p2 = x * 0.0091 - t * 3.7 + 1.3;
          const dy = CONFIG.wave ? 34 * Math.sin(p1) + 12 * Math.sin(p2) : 0;
          const slope = CONFIG.wave ? Math.cos(p1) * 0.75 + Math.cos(p2) * 0.35 : 0;
          ctx.drawImage(src, (x / W) * sw, 0, (STRIP / W) * sw + 1, sh, x, dy - 40, STRIP + 1, H + 80);
          ctx.fillStyle = slope > 0 ? `rgba(255,255,255,${0.1 * slope})` : `rgba(0,0,0,${-0.42 * slope})`;
          ctx.fillRect(x, 0, STRIP + 1, H);
        }
      };
      const wave = driver(0, draw);
      tl.fromTo(wave, { v: 0 }, { v: 12, duration: 12, ease: "none" }, 0);
      if (!src.complete) src.addEventListener("load", () => draw(wave.v()));

      // camera: pull back off the title, then a slow drift (never still)
      const P = CONFIG.pullBack;
      gsap.set($("cam"), { transformOrigin: P.origin });
      tl.fromTo($("cam"), { scale: P.fromScale, y: P.fromY }, { scale: 1, y: 0, duration: P.dur, ease: "sine.out" }, 0);
      tl.to($("cam"), { scale: CONFIG.drift.scale, y: CONFIG.drift.y, duration: CONFIG.drift.dur, ease: "sine.inOut" }, P.dur);

      tl.fromTo($("riser"), { y: CONFIG.riser.from }, { y: 0, duration: CONFIG.riser.dur, ease: "power2.out" }, CONFIG.riser.at);
      typeOn(tl, $("date"), CONFIG.date.at, CONFIG.date.step);

      if (CONFIG.exit) {
        const E = CONFIG.exit;
        tl.fromTo($("stage"), { x: 0 }, { x: -E.distance, duration: E.dur, ease: "sine.inOut" }, E.at);
      }

      window.__timelines[id] = tl;
    })();
  </script>
</template>
