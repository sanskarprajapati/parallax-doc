<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #raw {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      /* screen mask: a fine dot grid over the whole frame, like an LCD/CRT */
      #dots {
        position: absolute;
        inset: 0;
        background-image: url("assets/dots.png");
        background-size: 6px 6px;
        opacity: 0.12;
        mix-blend-mode: multiply;
      }
      /* thin vertical film scratches, each on screen for a handful of frames */
      .scratch {
        position: absolute;
        top: 0;
        width: 2px;
        height: 1080px;
        background: rgba(235, 235, 225, 0.5);
        filter: blur(0.4px);
      }
    </style>
  </head>
  <body>
    <!--
      The film look, applied once to the whole rendered film (render.sh copies it in as
      assets/raw.mp4). The grade on #raw: desaturated and cool, contrast up, highlights
      held, a heavy vignette, grain, deterministic dust and wear, and a slight channel
      split. Change it with: npx hyperframes media-treatment --selector "#raw" --grading '{...}' --apply
      Scratches past the film's end are simply never shown.
    -->

&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" id="raw" class="clip" src="assets/raw.mp4" data-start="0" data-duration="60" data-track-index="1" muted playsinline style="z-index: 1"></video>

      <audio id="vo" class="clip" src="assets/vo.m4a" data-start="0" data-duration="60" data-track-index="30" data-volume="1"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["finish"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
